name: Migrar dados do Credenciamento

# Roda a carga MySQL (Railway) → Postgres (Supabase) a partir do GitHub, e não
# da máquina de alguém.
#
# ⚠️ POR QUE AQUI. O runner do Actions alcança as duas pontas — o proxy público
# do Railway e o pooler do Supabase — e já guarda os segredos. A alternativa
# seria alguém clonar o repositório, instalar Node e colar duas strings de
# conexão de produção num arquivo local: mais passos, e a credencial do banco
# de dezesseis mil pessoas passando por mais um computador.
#
# Nunca dispara sozinho. Só por `workflow_dispatch`, e o padrão é ENSAIO.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "ensaio lê e não grava nada; gravar aplica de verdade"
        type: choice
        options: [ensaio, gravar]
        default: ensaio
      fase:
        description: "Uma fase só, ou 'todas'. Nome que não existe PARA a carga em vez de rodar nada."
        type: choice
        # Na ORDEM em que o script executa — o menu é a documentação da ordem.
        options: [todas, pessoas, vinculos, estrutura, eventos, compras, comissao, configuracao, auditoria, sequencias]
        default: todas
      regiao_supabase:
        description: "Região do pooler do Supabase. Só mude se o projeto não for de São Paulo."
        type: string
        default: sa-east-1

jobs:
  migrar:
    runs-on: ubuntu-latest
    # Onde moram as credenciais das duas pontas.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A conexão com o Supabase é MONTADA a partir dos segredos que já
      # existem para as migrações de esquema — não é um segredo novo. Pedir
      # `DATABASE_URL` à parte seria pedir de novo, com outro nome, a mesma
      # senha que já está guardada ali.
      #
      # `DATABASE_URL` continua valendo se estiver definida: projeto fora de
      # São Paulo, ou pooler com host diferente, resolve-se assim sem mexer
      # neste arquivo.
      - name: Montar a conexão com o Supabase
        id: destino
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SENHA: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REGIAO: ${{ inputs.regiao_supabase }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
            echo "Usando DATABASE_URL definida como segredo."
            exit 0
          fi
          if [ -z "$REF" ] || [ -z "$SENHA" ]; then
            echo "::error::Sem como alcançar o Supabase: defina DATABASE_URL, ou garanta SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD (os mesmos que aplicam as migrações)."
            exit 1
          fi
          # ⚠️ A senha vai codificada: uma senha com @ ou / quebraria a URL, e
          # o erro seria "host não encontrado" — que manda procurar rede.
          SENHA_URL=$(printf '%s' "$SENHA" | jq -sRr @uri)
          echo "url=postgresql://postgres.$REF:$SENHA_URL@aws-0-$REGIAO.pooler.supabase.com:6543/postgres" >> "$GITHUB_OUTPUT"
          echo "Conexão montada a partir de SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD."

      # ⚠️ Segredo ausente chega como string vazia. Sem esta conferência, a
      # carga começaria e falharia no meio, com parte dos dados gravados e
      # nenhuma pista de que o problema era configuração.
      - name: Conferir o acesso à origem
        env:
          MIGRACAO_MYSQL_URL: ${{ secrets.MIGRACAO_MYSQL_URL }}
          CHAVE: ${{ secrets.CREDENCIAIS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$MIGRACAO_MYSQL_URL" ]; then
            echo "::error::Falta MIGRACAO_MYSQL_URL."
            echo ""
            echo "É UM copiar-e-colar: no Railway, serviço MySQL → aba Variables →"
            echo "copie o valor de MYSQL_PUBLIC_URL e cole aqui, em"
            echo "Settings → Environments → Production → Environment secrets."
            echo ""
            echo "⚠️ MYSQL_PUBLIC_URL, não MYSQL_URL: a segunda usa o host"
            echo ".internal, que só funciona dentro da rede do Railway — e o"
            echo "runner do GitHub está fora dela."
            echo ""
            echo "Nada foi lido nem gravado."
            exit 1
          fi
          # ⚠️ A chave de cifra NÃO bloqueia a carga. Ela serve a uma fase só
          # — `configuracao`, que cifra a chave da Cielo —, e travar as outras
          # sete por causa dela seria adiar dezesseis mil pessoas por causa de
          # uma linha. Sem a chave, aquela fase se declara PULADA no relatório,
          # e roda depois sozinha.
          if [ "${{ inputs.modo }}" = "gravar" ] && [ -z "$CHAVE" ]; then
            echo "::warning::Sem CREDENCIAIS_ENCRYPTION_KEY: a fase configuracao será pulada (a conta Cielo não entra). Precisa ser a MESMA da Vercel."
          fi

      - name: Rodar a carga
        env:
          MIGRACAO_MYSQL_URL: ${{ secrets.MIGRACAO_MYSQL_URL }}
          DATABASE_URL: ${{ steps.destino.outputs.url }}
          CREDENCIAIS_ENCRYPTION_KEY: ${{ secrets.CREDENCIAIS_ENCRYPTION_KEY }}
        run: |
          argumentos=""
          [ "${{ inputs.modo }}" = "ensaio" ] && argumentos="$argumentos --dry-run"
          # "todas" é o padrão e não vira argumento — o script já roda tudo sem ele.
          [ -n "${{ inputs.fase }}" ] && [ "${{ inputs.fase }}" != "todas" ] \
            && argumentos="$argumentos --fase=${{ inputs.fase }}"
          if [ "${{ inputs.modo }}" = "gravar" ]; then
            echo "::warning::Modo GRAVAR: isto escreve no banco de produção."
          fi
          npm run migrar -- $argumentos

      # O relatório traz contagens por fase e as rejeições com motivo e id
      # antigo. NÃO contém dado pessoal — é por isso que pode virar artefato.
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ inputs.modo }}-${{ github.run_number }}
          path: migracao-relatorio-*.json
          if-no-files-found: warn
          retention-days: 30
