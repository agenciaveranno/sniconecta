name: Migrações do banco

# Aplica as migrações SQL no projeto Supabase quando um arquivo novo chega à
# main. É o único caminho para o esquema de produção mudar.
#
# Segredos necessários no repositório:
#   SUPABASE_ACCESS_TOKEN  token pessoal/da organização no Supabase
#   SUPABASE_PROJECT_REF   ref do projeto (o "xxxx" de xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ⚠️ Segredo ausente chega como string VAZIA, não como erro. Sem esta
      # conferência, o `supabase link` responde "Access token not provided" —
      # frase que soa como token inválido e manda quem depura procurar no
      # Supabase, quando o que falta é o segredo no repositório. Já custou
      # duas execuções.
      - name: Conferir os segredos do repositório
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # ⚠️ Só as CHAVES são impressas, nunca os valores. Serve para dizer
          # ONDE o segredo foi parar: a mesma página do GitHub tem a aba
          # Secrets e a aba Variables, e segredo guardado como variável fica
          # invisível para `secrets.X` — sem esta lista, o erro é idêntico ao
          # de não ter cadastrado nada.
          SEGREDOS_VISIVEIS: ${{ toJSON(secrets) }}
          VARIAVEIS_VISIVEIS: ${{ toJSON(vars) }}
        run: |
          faltam=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || faltam="$faltam SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ]  || faltam="$faltam SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || faltam="$faltam SUPABASE_DB_PASSWORD"
          if [ -n "$faltam" ]; then
            echo "::error::Faltam segredos no repositório:$faltam"
            echo ""
            echo "O que este job CONSEGUE enxergar hoje (só os nomes):"
            echo "  Secrets:   $(echo "$SEGREDOS_VISIVEIS" | jq -r 'keys | join(", ") // "nenhum"')"
            echo "  Variables: $(echo "$VARIAVEIS_VISIVEIS" | jq -r 'keys | join(", ") // "nenhuma"')"
            echo ""
            echo "Se o nome aparece em Variables, ele foi cadastrado na aba errada:"
            echo "credencial vai em Secrets, que o log mascara — variável aparece"
            echo "em claro para quem abrir a execução."
            echo ""
            echo "Se não aparece em lugar nenhum, provavelmente foi cadastrado"
            echo "dentro de um AMBIENTE (Preview, Production). Este job não declara"
            echo "environment, então enxerga só os Repository secrets — a seção de"
            echo "baixo da página, sem ambiente algum:"
            echo "  Settings → Secrets and variables → Actions → Repository secrets"
            echo ""
            echo "  SUPABASE_ACCESS_TOKEN  Account → Access Tokens, em supabase.com"
            echo "  SUPABASE_PROJECT_REF   o 'xxxx' de xxxx.supabase.co"
            echo "  SUPABASE_DB_PASSWORD   Project Settings → Database"
            echo ""
            echo "Nada foi aplicado no banco."
            exit 1
          fi
          echo "Os três segredos estão presentes."

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
